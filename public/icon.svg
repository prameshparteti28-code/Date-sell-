<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.4" />
  <!-- Signal & Data Wave Graphic -->
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Concentric Wi-Fi waves -->
    <path d="M -130 -40 A 170 170 0 0 1 130 -40" fill="none" stroke="url(#grad)" stroke-width="22" stroke-linecap="round" />
    <path d="M -90 10 A 120 120 0 0 1 90 10" fill="none" stroke="url(#grad)" stroke-width="20" stroke-linecap="round" opacity="0.85" />
    <path d="M -50 60 A 70 70 0 0 1 50 60" fill="none" stroke="url(#grad)" stroke-width="18" stroke-linecap="round" opacity="0.95" />
    <!-- Center data hub / coin -->
    <circle cx="0" cy="110" r="32" fill="url(#grad)" />
  </g>
  <!-- Rupee Symbol on Center Hub -->
  <g fill="#ffffff" transform="translate(256, 330) scale(1.1)">
    <text x="0" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="34" text-anchor="middle" dominant-baseline="central">₹</text>
  </g>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">DATA PAY</text>
</svg>
